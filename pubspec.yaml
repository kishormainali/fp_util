name: fp_util
description: Utilities and Extensions for num,BuildContext,EdgeInsets,File,String. constants for horizontal and vertical spacing.

version: 4.0.0
homepage: https://docs.kishormainali.com/
repository: https://github.com/kishormainali/fp_util
issue_tracker: https://github.com/kishormainali/fp_util/issues
topics:
  - extensions
  - tags-input-field
  - utilities
  - spacing
  - widgets

environment:
  sdk: ">=3.4.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  mime: ^2.0.0

  # image picker
  image_picker: ^1.2.0

  # file picker
  file_picker: ^10.3.3

  # svg
  flutter_svg: ^2.2.1

  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  path: any # use version compatible with flutter
  intl: any # use version compatible with flutter

  equatable: ^2.0.7

  mask_text_input_formatter: ^2.9.0

  gap: ^3.0.1

  uuid: ^4.5.1

  flutter_animate: ^4.5.2

  collection: any # use version compatible with flutter

  dio: ^5.9.0

  ansicolor: ^2.0.3


dev_dependencies:
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  build_runner: ^2.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/full_logo.png
